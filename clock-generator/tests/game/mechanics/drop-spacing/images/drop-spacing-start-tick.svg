<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="545" viewBox="0 0 1120 545" role="img" aria-labelledby="title desc">
  <title id="title">A start 8 ticks later lands one slot further along</title>
  <desc id="desc">Three strips of the 14 slots of one belt lane for copies 12 tiles apart. Starting the second inserter of every copy 0 ticks after the first fits, 8 ticks after puts the second hands on the first hands' slots so they collide, and 16 ticks after fits again, because the belt moves one tile in 8 ticks.</desc>
