name: Publish sidecar mod

# The sidecar mod has a version of its own (clock-generator-sidecar/info.json) and is published to the Factorio mod
# portal when that version is not there yet. Only a release or a hotfix merge publishes it, as part of release.yml:
# - release.yml calls this workflow after its gate, and the tests of the release have passed, when the version of the mod
#   is not on the portal;
# - "Run workflow" (or `gh workflow run publish-sidecar.yml --ref <branch>`) tries a failed upload again. It runs the gate
#   of release.yml (.github/scripts/release-gate.sh) on the last commit of the branch, and uploads only when that commit
#   is a release or a hotfix merge. It does not run the tests again: the commit has passed them in its release run.
# A merge to the folder of the mod that is not a release or a hotfix merge publishes nothing.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  publish-sidecar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # holds the FACTORIO_MOD_API_KEY secret, and can require approval before anything is published
    environment: mod-portal
    env:
      MOD_NAME: clock-generator-sidecar
    steps:
      - uses: actions/checkout@v4

      # a call from release.yml has passed this gate already
      - name: Gate, is this a release or a hotfix merge?
        id: gate
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: .github/scripts/release-gate.sh "$REPO" "$GITHUB_SHA" "$BRANCH"

      - name: Read the version of the mod
        run: echo "VERSION=$(node -p "require('./clock-generator-sidecar/info.json').version")" >> "$GITHUB_ENV"

      - name: Skip when the portal already has this version
        id: portal
        if: steps.gate.outputs.release != 'false'
        run: |
          if [ "$(.github/scripts/portal-has-version.sh "$MOD_NAME" "$VERSION")" = true ]; then
            echo "$MOD_NAME $VERSION is already on the mod portal, skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the mod
        if: steps.portal.outputs.publish == 'true'
        run: ./clock-generator-sidecar/build.sh

      - name: Upload to the mod portal
        if: steps.portal.outputs.publish == 'true'
        env:
          FACTORIO_MOD_API_KEY: ${{ secrets.FACTORIO_MOD_API_KEY }}
        run: |
          if [ -z "$FACTORIO_MOD_API_KEY" ]; then
            echo "::error::The FACTORIO_MOD_API_KEY secret is not set"
            exit 1
          fi
          UPLOAD_URL=$(curl -fsS -X POST https://mods.factorio.com/api/v2/mods/releases/init_upload \
            -H "Authorization: Bearer $FACTORIO_MOD_API_KEY" \
            -F "mod=$MOD_NAME" | jq -er '.upload_url')
          curl -fsS -X POST "$UPLOAD_URL" -F "file=@clock-generator-sidecar/${MOD_NAME}_${VERSION}.zip"
          echo "Published $MOD_NAME $VERSION to the mod portal."
