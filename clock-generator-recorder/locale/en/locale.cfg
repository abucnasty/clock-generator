[item-name]
clock-generator-recorder=Clock Generator Recorder

[item-description]
clock-generator-recorder=Select a running clock (including its clock combinator) to record inserter and machine activity to script-output. Alt-select to stop a recording early. Use the shortcut (CTRL+ALT+E) or toolbar button for quick access.

[shortcut-name]
clock-generator-recorder-shortcut=Clock Generator Recorder

[mod-setting-name]
clock-generator-recorder-periods=Clock periods to record
clock-generator-recorder-minimum-ticks=Minimum ticks to record
clock-generator-recorder-ticks-without-clock=Ticks to record without a clock

[mod-setting-description]
clock-generator-recorder-periods=Number of full clock periods the recorder captures, starting when the clock wraps to 0.
clock-generator-recorder-minimum-ticks=Keeps recording whole clock periods until at least this many ticks are recorded, for a longer look at slow things like fuel. 0 records only the clock periods above. 3600 ticks is a minute; a recording takes roughly half a kilobyte per tick for a dozen inserters. Alt-select stops a recording early.
clock-generator-recorder-ticks-without-clock=Recording length when no clock combinator is part of the selection.
