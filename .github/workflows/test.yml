name: Test

on:
  pull_request:

# a new push to a pull request replaces the run of the one before it
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clock-generator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clock-generator/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

      # the game-backed tests need a Factorio install and are not part of this: `npm run test:game`
      - name: Unit tests
        run: npm test

  ui:
    name: UI build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clock-generator-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            clock-generator/package-lock.json
            clock-generator-ui/package-lock.json

      - run: npm ci

      # installs and builds clock-generator first, then type-checks and bundles the UI
      - run: npm run build
