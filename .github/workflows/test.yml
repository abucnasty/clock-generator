name: Test

# Started by hand only ("Run workflow", or `gh workflow run test.yml --ref <branch>`), not on pull requests for now.
# The unit tests take over ten minutes on the runner, where they take three on a desktop, and are to be faster
# first. The UI build is what Vercel does on every push anyway (vercel.json): it compiles the generator, then
# type-checks and bundles the UI, and reports on the pull request.
on:
  workflow_dispatch:

# a new run on a branch replaces the one before it
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clock-generator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clock-generator/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

      # the game-backed tests need a Factorio install and are not part of this: `npm run test:game`
      - name: Unit tests
        run: npm test

  ui:
    name: UI build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clock-generator-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            clock-generator/package-lock.json
            clock-generator-ui/package-lock.json

      - run: npm ci

      # installs and builds clock-generator first, then type-checks and bundles the UI
      - run: npm run build
