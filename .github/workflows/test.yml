name: Test

# Pull requests run the unit tests, build the UI and generate a clock in it in a browser. Pull requests to master, which
# are what gets released, and to an integration branch (feature/... or release/...), run the generation tests as well: they generate the clock alternatives of whole samples and
# take minutes. Pull requests also generate every blast job, in shards, and compare it with the committed record (clock-generator/record/).
# Those pull requests run none of the test jobs when they change documentation only (see the `changes` job), except the
# docs checks, which run on every pull request (the `docs` job). "Run workflow" (or
# `gh workflow run test.yml --ref <branch>`) runs them all on any branch (the record check runs on pull requests only).
# The two heavy suites, the generation shards and the record shards, do not run on a draft pull request (GitHub's free plan runs
# 20 jobs at once, and a pull request starts about 22): the checks "Gen summary" and "Rec summary" run and fail there, with the
# way to run them, rather than pass or skip, which a required check counts as passing. Marking the pull request ready runs everything.
# release.yml and publish-sidecar.yml call this workflow and do nothing unless it passes; a release runs the generation
# tests too, publishing the sidecar does not.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      generation:
        description: Run the generation tests as well
        type: boolean
        default: true
  workflow_call:
    inputs:
      generation:
        description: Run the generation tests as well
        type: boolean
        default: false

permissions:
  contents: read

# A new run of a pull request replaces the one before it. Any other run is a group of its own: a called run has the
# github context of its caller (its event, ref and run id), and grouped by ref the tests of a release and of the
# sidecar for the same push to master, or a run by hand on master, would cancel each other and skip what waits for them.
concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    needs: changes
    # skipped (which satisfies a required check) when the pull request changes documentation only; run when `changes` did not run or failed
    if: ${{ !cancelled() && needs.changes.outputs.generation != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clock-generator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clock-generator/package-lock.json

      - run: npm ci

      - name: Unused files, exports and dependencies
        run: npm run knip

      - name: Type-check simulator and game tests (no Factorio needed)
        run: npm run test:typecheck

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      # the game-backed tests need a Factorio install and are not part of this: `npm run test:game`
      - name: Unit tests
        run: npm test -- --reporter=default

  # The documentation checks: the generated files are what their sources give (the sidecar's PORTAL.md from the user
  # topics on exporting a build, docs/maintainer/configuration-file-fields.md from the engine's ConfigSchema), and every bold label
  # of the user topics is a string of the site, of the sidecar or of docs/game-labels.tsv. They run on every pull request
  # and every call, documentation only or not: a change to a topic, to the schema or to a label can break them. On a
  # pull request, the Markdown lines it adds use none of the glossary's Avoid words.
  docs:
    name: Docs checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: clock-generator
    steps:
      # the base of a pull request is the first parent of its merge commit
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clock-generator/package-lock.json

      - run: npm ci

      - name: PORTAL.md is current
        run: npm run docs:portal -- --check

      # builds the engine first: the generator reads the schema from dist/
      - name: Configuration file fields topic is current
        run: npm run docs:fields -- --check

      - name: Bold labels of the user topics
        run: npm run test:docs -- --reporter=default

      # the lines the pull request adds only: the words already there are a sweep's, not this pull request's
      - name: Glossary Avoid words in the added Markdown
        if: github.event_name == 'pull_request'
        run: npm run docs:avoid-words -- --base HEAD^1

  # Whether the tests have anything to test: not when a pull request to master, to a feature/ or to a release/ branch changes
  # documentation only. The output is called `generation` for the generation tests it first decided; the unit and UI jobs
  # follow it too, and only a `false` skips them.
  # Decided by the files the pull request changes, never by its branch name. A run asked for the generation tests (by
  # hand, or a release) runs them whatever it changes. Anything this cannot tell, such as a checkout that is not a merge
  # commit, runs them.
  changes:
    name: Changed files
    # the input rather than the event, since a called run has the event of its caller: a push or a run by hand
    if: inputs.generation || github.base_ref == 'master' || startsWith(github.base_ref, 'feature/') || startsWith(github.base_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      generation: ${{ steps.files.outputs.generation }}
    steps:
      # a pull request is checked out as the merge of its head into its base: the first parent of that commit is the base,
      # the second the head, and the two together are what the pull request changes
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Files the pull request changes
        id: files
        env:
          REQUESTED: ${{ inputs.generation }}
        run: |
          set -eu
          if [ "$REQUESTED" = "true" ]; then
            echo "generation=true" >> "$GITHUB_OUTPUT"
            echo "The generation tests were asked for: they run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git rev-parse --verify --quiet HEAD^2 > /dev/null; then
            echo "generation=true" >> "$GITHUB_OUTPUT"
            echo "The checkout is not a merge commit, so what the pull request changes is not known: the generation tests run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # --no-renames lists both paths of a rename, so that moving code to a Markdown file is a change of code
          git diff --name-only --no-renames HEAD^1 HEAD > changed.txt
          echo "The pull request changes $(wc -l < changed.txt) file(s)."
          code=$(mktemp)
          # documentation: Markdown anywhere, the docs/ folder of the repository and of the generator
          while IFS= read -r file; do
            case "$file" in
              *.md | docs/* | clock-generator/docs/*) ;;
              *) echo "$file" >> "$code" ;;
            esac
          done < changed.txt
          if [ -s "$code" ]; then
            echo "generation=true" >> "$GITHUB_OUTPUT"
            { echo "The generation tests run: the pull request changes files that are not documentation, such as"; head -n 5 "$code" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "generation=false" >> "$GITHUB_OUTPUT"
            echo "The generation tests are skipped: the pull request changes documentation only ($(wc -l < changed.txt) file(s))." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The generation tests, in shards: the sequencer of clock-generator/ci/duration-sequencer.ts (set in vitest.config.ts)
  # deals the files out to the shards by their measured durations (ci/generation-durations.json), longest first, and
  # the job's wall time is that of the slowest shard. Plain `--shard` would give them out by the hash of their paths,
  # which put the two slowest files in one shard. Every shard computes the whole split and takes its part, so no file
  # is missed or run twice, and a new or renamed file still runs, counted as the median file. Refresh the durations with
  # clock-generator/scripts/ci/update-generation-durations.js from the reports of a run. Each shard is a runner of its
  # own (4 vCPUs) and tests with all of it. The check that is named "Gen summary" is the job after the shards.
  generation-shards:
    name: Gen ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: changes
    if: needs.changes.outputs.generation == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # the builds that are jobs of the record are checked there (tests/game/builds/job-checks/), so the generation tests are the
    # options and searches the record does not run: about 700 s of runner time on 2026-11-05, half of it in a shard
    timeout-minutes: 25
    strategy:
      # every shard finishes, so that a pull request shows all its failures at once
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: clock-generator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clock-generator/package-lock.json

      - run: npm ci

      # Vitest starts the files that took longest in the run before; without its results it starts the largest files,
      # and a short file that is one of the slowest, started last, runs alone for minutes. The results are saved at
      # the end of every run (one cache entry each, one series for each shard count and shard: a change of the number
      # of shards starts new series) and the newest of the shard is restored, after `npm ci`, which empties node_modules.
      - name: Durations of the last generation tests
        uses: actions/cache@v4
        with:
          path: clock-generator/node_modules/.vite/vitest
          key: generation-shard-durations-${{ strategy.job-total }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: generation-shard-durations-${{ strategy.job-total }}-${{ matrix.shard }}-

      - name: Build
        run: npm run build

      # hosted runners differ in CPU, and the generation tests are CPU-bound: the same suite has taken 10 and 20 minutes
      - name: Runner CPU
        run: lscpu | grep -E '^(Model name|CPU\(s\)):'

      - name: Generation tests
        run: >-
          npm run test:generation -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=default
          --reporter=json --outputFile.json=.scratch/test-results/generation.json
          --reporter=junit --outputFile.junit=.scratch/test-results/generation.xml

      - name: Generation timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generation-test-results-${{ matrix.shard }}
          path: clock-generator/.scratch/test-results/generation.*
          if-no-files-found: ignore
          retention-days: 14

  # The check "Gen summary": one name for the shards, whatever their number. It reports success when the pull
  # request changes documentation only (the shards are skipped then), and fails when the changed files could not be read or a
  # shard failed. It is skipped, as the generation tests always were, where they are not asked for.
  generation:
    name: Gen summary
    needs: [changes, generation-shards]
    # not skipped with the shards: it is the job that tells what became of them
    if: ${{ !cancelled() && (inputs.generation || github.base_ref == 'master' || startsWith(github.base_ref, 'feature/') || startsWith(github.base_ref, 'release/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Not run on a draft
        if: github.event.pull_request.draft == true
        run: |
          echo "::error::Not run on a draft: mark the pull request ready, or run \`gh workflow run test.yml --ref <branch>\`."
          echo 'not run on a draft: mark the pull request ready, or run `gh workflow run test.yml --ref <branch>`' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Result of the generation tests
        env:
          CHANGES: ${{ needs.changes.result }}
          GENERATION: ${{ needs.changes.outputs.generation }}
          SHARDS: ${{ needs.generation-shards.result }}
        run: |
          set -eu
          if [ "$CHANGES" != "success" ]; then
            echo "::error::The files the pull request changes could not be read ($CHANGES), so it is not known whether the generation tests were due."
            exit 1
          fi
          if [ "$GENERATION" != "true" ]; then
            echo "The generation tests were not due: the pull request changes documentation only." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$SHARDS" != "success" ]; then
            echo "::error::The generation tests did not pass: the shards ended $SHARDS."
            exit 1
          fi
          echo "The generation tests passed in every shard." | tee -a "$GITHUB_STEP_SUMMARY"

  # The record (clock-generator/record/): one small JSON per blast job, the selected clock and every alternative. The jobs
  # are generated the way `blast.sh run` does (a process for each job, four at a time on a runner's 4 vCPUs), in shards: the
  # jobs are dealt out by the seconds each took on a runner (ci/record-durations.json, longest first onto the shard that is then
  # estimated to finish first; scripts/blast/shard.py), so that the shards finish together, and the pull request waits for the
  # slowest, which is never faster than its slowest job (the productivity module chest chain). Refresh the durations with
  # clock-generator/scripts/ci/update-record-durations.js from the `record-jobs-<n>` artifacts of a run. The check named
  # "Rec summary" is the job after the shards.
  record-shards:
    name: Rec ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: changes
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft != true && needs.changes.outputs.generation == 'true' }}
    runs-on: ubuntu-latest
    # one runner took 24 minutes for all 86 jobs on 2026-11-05; a shard has about a sixth of them
    timeout-minutes: 25
    strategy:
      # every shard finishes, so that a pull request shows all its failures at once
      fail-fast: false
      matrix:
        # the smallest count whose estimated slowest shard is the slowest job: `node scripts/ci/update-record-durations.js --shards`
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: clock-generator
    env:
      BLAST_GROUPS: config,pickup,overhood,front,blocked,containers,variants
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clock-generator/package-lock.json

      - run: npm ci

      # hosted runners differ in CPU, and the jobs are CPU-bound
      - name: Runner CPU
        run: lscpu | grep -E '^(Model name|CPU\(s\)):'

      # builds the engine, generates this shard's jobs into a folder (not cached: the runner starts empty)
      - name: Generate the jobs of the shard
        run: bash scripts/blast/blast.sh run .. "$RUNNER_TEMP/blast-jobs" --no-store --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      # the job files (and the shard's list of jobs): the Rec summary joins them, and each holds the seconds its job took
      - name: Job files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: record-jobs-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/blast-jobs/*.json
          if-no-files-found: ignore
          retention-days: 14

  # The check "Rec summary": one name for the shards, whatever their number. It joins the shards' job files and compares them with
  # the committed record (field by field; a difference fails with a table of job, field, before and after, in the job summary too),
  # then checks the properties of the jobs and that no selected clock got worse (below). It reports success when the pull request
  # changes documentation only (the shards are skipped then), and fails when the changed files could not be read or a shard failed.
  # It runs on pull requests to master and to feature/ and release/ branches, as the shards do, and not on a release (which calls this workflow
  # and does nothing unless it passes). Its name is stable, so that it can be a required check.
  record:
    name: Rec summary
    needs: [changes, record-shards]
    # not skipped with the shards: it is the job that tells what became of them
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (github.base_ref == 'master' || startsWith(github.base_ref, 'feature/') || startsWith(github.base_ref, 'release/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clock-generator
    steps:
      - name: Not run on a draft
        if: github.event.pull_request.draft == true
        working-directory: .
        run: |
          echo "::error::Not run on a draft: mark the pull request ready, or run \`gh workflow run test.yml --ref <branch>\`."
          echo 'not run on a draft: mark the pull request ready, or run `gh workflow run test.yml --ref <branch>`' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Whether the record check is due
        id: due
        working-directory: .
        env:
          CHANGES: ${{ needs.changes.result }}
          GENERATION: ${{ needs.changes.outputs.generation }}
          SHARDS: ${{ needs.record-shards.result }}
        run: |
          set -eu
          if [ "$CHANGES" != "success" ]; then
            echo "::error::The files the pull request changes could not be read ($CHANGES), so it is not known whether the record check was due."
            exit 1
          fi
          if [ "$GENERATION" != "true" ]; then
            echo "The record check was not due: the pull request changes documentation only." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "due=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$SHARDS" != "success" ]; then
            echo "::error::The record jobs did not all finish: the shards ended $SHARDS."
            exit 1
          fi
          echo "due=true" >> "$GITHUB_OUTPUT"

      # the merge commit of the pull request: its first parent is the base, its second the head
      - uses: actions/checkout@v4
        if: steps.due.outputs.due == 'true'
        with:
          fetch-depth: 2

      - name: Job files of the shards
        if: steps.due.outputs.due == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: record-jobs-*
          path: ${{ runner.temp }}/shards

      - name: Join the shards
        if: steps.due.outputs.due == 'true'
        run: python3 scripts/blast/shard.py merge "$RUNNER_TEMP/blast-jobs" "$RUNNER_TEMP"/shards/record-jobs-* | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check the record
        if: steps.due.outputs.due == 'true'
        run: bash scripts/blast/blast.sh record check --summary "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/blast-jobs"

      # a selected clock that got worse than in the base fails unless record/MOVES.md names its job in the lines the pull request adds
      - name: Never worse
        if: steps.due.outputs.due == 'true' && !cancelled()
        run: |
          set -eu
          if ! git rev-parse --verify --quiet HEAD^2 > /dev/null; then
            echo "::error::The checkout is not a merge commit, so the base of the pull request is not known."
            exit 1
          fi
          # paths from the root of the repository, whatever the folder of the step
          root=$(git rev-parse --show-toplevel)
          base=$(mktemp -d)
          git -C "$root" archive HEAD^1 clock-generator/record | tar -x -C "$base"
          git -C "$root" diff -U0 HEAD^1 HEAD -- clock-generator/record/MOVES.md | sed -n 's/^+\([^+].*\)$/\1/p' > "$RUNNER_TEMP/moves-added.txt"
          python3 scripts/blast/record.py worse --base "$base/clock-generator/record" --moves "$RUNNER_TEMP/moves-added.txt" --summary "$GITHUB_STEP_SUMMARY"

  ui:
    name: UI build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.generation != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clock-generator-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            clock-generator/package-lock.json
            clock-generator-ui/package-lock.json

      - run: npm ci

      # installs and builds clock-generator first, then type-checks and bundles the UI
      - run: npm run build

      # after the build, which knip needs to see the engine as the dependency it is
      - name: Unused files, exports and dependencies
        run: npm run knip

      - name: Lint
        run: npm run lint

      # public/icons holds the icons the page always draws, and no file it never asks for
      - name: Icons
        run: npm run check:icons

      # all but the tests that generate the clock of every sample, which are the job after this one
      - name: Unit tests
        run: npm run test:fast -- --reporter=default

  # The UI tests that generate the clock of every sample (about a minute for the original pink science sample alone),
  # beside the UI build instead of in it: they need the engine built and the UI's modules, nothing of the UI build.
  ui-samples:
    name: UI samples
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.generation != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            clock-generator/package-lock.json
            clock-generator-ui/package-lock.json

      # the tests load the built engine (clock-generator/dist), and the UI links to it
      - name: Build the engine
        working-directory: clock-generator
        run: npm ci && npm run build

      - name: Install the UI
        working-directory: clock-generator-ui
        run: npm ci

      - name: Sample tests
        working-directory: clock-generator-ui
        run: npm run test:samples -- --reporter=default

  # Generate in the UI in headless Chromium, on the dev server and on the production build, failing on any error the
  # page or a worker reports. The UI's unit tests run under Node and the UI build runs nothing, so neither saw #258 read
  # process.env in the engine, which the browser's worker does not have: every Generate on the dev server failed with
  # "process is not defined" while every check passed.
  browser:
    name: UI browser
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.generation != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clock-generator-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            clock-generator/package-lock.json
            clock-generator-ui/package-lock.json

      - run: npm ci

      # the headless Chromium of the playwright version the lockfile pins
      - name: Chromium
        run: npx playwright install --only-shell chromium

      # installs and builds clock-generator, copies the game data and the examples into public/ and bundles the UI
      - run: npm run build

      - name: Generate in a browser
        run: npm run test:browser
