name: Test

# Pull requests run the unit tests and build the UI. Pull requests to master, which are what gets released, run the
# generation tests as well: they generate the clock alternatives of whole samples and take minutes, most of it one test.
# "Run workflow" (or `gh workflow run test.yml --ref <branch>`) runs all three on any branch.
# release.yml and publish-sidecar.yml call this workflow and do nothing unless it passes; a release runs the generation
# tests too, publishing the sidecar does not.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      generation:
        description: Run the generation tests as well
        type: boolean
        default: true
  workflow_call:
    inputs:
      generation:
        description: Run the generation tests as well
        type: boolean
        default: false

permissions:
  contents: read

# A new run of a pull request replaces the one before it. Any other run is a group of its own: a called run has the
# github context of its caller (its event, ref and run id), and grouped by ref the tests of a release and of the
# sidecar for the same push to master, or a run by hand on master, would cancel each other and skip what waits for them.
concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clock-generator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clock-generator/package-lock.json

      - run: npm ci

      - name: Unused files, exports and dependencies
        run: npm run knip

      - name: Type-check simulator and game tests (no Factorio needed)
        run: npm run test:typecheck

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      # the game-backed tests need a Factorio install and are not part of this: `npm run test:game`
      - name: Unit tests
        run: npm test -- --reporter=default

  generation:
    name: Generation tests
    # the input rather than the event, since a called run has the event of its caller: a push or a run by hand
    if: inputs.generation || github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clock-generator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clock-generator/package-lock.json

      - run: npm ci

      # Vitest starts the files that took longest in the run before; without its results it starts the largest files,
      # and over-hood-clock, a short file and one of the slowest, started last and ran alone for minutes. The results
      # are saved at the end of every run (one cache entry each) and the newest is restored, after `npm ci`, which
      # empties node_modules.
      - name: Durations of the last generation tests
        uses: actions/cache@v4
        with:
          path: clock-generator/node_modules/.vite/vitest
          key: generation-durations-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: generation-durations-

      - name: Build
        run: npm run build

      - name: Generation tests
        run: >-
          npm run test:generation -- --reporter=default
          --reporter=json --outputFile.json=../work/test-results/generation.json
          --reporter=junit --outputFile.junit=../work/test-results/generation.xml

      - name: Generation timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generation-test-results
          path: work/test-results/generation.*
          if-no-files-found: ignore
          retention-days: 14

  ui:
    name: UI build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clock-generator-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            clock-generator/package-lock.json
            clock-generator-ui/package-lock.json

      - run: npm ci

      # installs and builds clock-generator first, then type-checks and bundles the UI
      - run: npm run build

      # after the build, which knip needs to see the engine as the dependency it is
      - name: Unused files, exports and dependencies
        run: npm run knip

      - name: Lint
        run: npm run lint

      # public/icons holds the icons the page always draws, and no file it never asks for
      - name: Icons
        run: npm run check:icons

      - name: Unit tests
        run: npm test -- --reporter=default
