name: Test

# Pull requests run the unit tests and build the UI. Pull requests to master, which are what gets released, run the
# generation tests as well: they generate the clock alternatives of whole samples and take minutes, most of it one test.
# "Run workflow" (or `gh workflow run test.yml --ref <branch>`) runs all three on any branch.
on:
  pull_request:
  workflow_dispatch:

# a new run on a branch replaces the one before it
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clock-generator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clock-generator/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

      # the game-backed tests need a Factorio install and are not part of this: `npm run test:game`
      - name: Unit tests
        run: npm test -- --reporter=default

  generation:
    name: Generation tests
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clock-generator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clock-generator/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

      # Vitest starts the files that took longest last time first, so that the slowest one is not the last to
      # start: the durations are kept between runs here. Any earlier run's are good enough to order by.
      - name: Restore the test durations of the last run
        uses: actions/cache@v4
        with:
          path: clock-generator/node_modules/.vite/vitest
          key: vitest-durations-${{ github.run_id }}
          restore-keys: vitest-durations-

      - name: Generation tests
        run: npm run test:generation -- --reporter=default

  ui:
    name: UI build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clock-generator-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            clock-generator/package-lock.json
            clock-generator-ui/package-lock.json

      - run: npm ci

      # installs and builds clock-generator first, then type-checks and bundles the UI
      - run: npm run build
