[item-name]
clock-generator-sidecar=Clock Generator Sidecar

[item-description]
clock-generator-sidecar=Select one unit of your build to export it for the Clock Generator: its machines, inserters, belts, chests, mining drills, cars, tanks, cargo wagons and rocket silos. Use the shortcut (ALT+E) or toolbar button for quick access.

[shortcut-name]
clock-generator-sidecar-shortcut=Clock Generator Sidecar

[clock-generator-sidecar]
gui-title=Clock Generator Sidecar
entity-count=__1__ entities selected
suggested-target=Suggested target: __1__ at up to __2__ per second
suggested-target-tooltip=The product that leaves this selection, and what its machines make together if they never stop. The Clock Generator fills it in as the target. You can change it there.
no-machines=No machines with active recipes found in selection.
no-machines-selected=No machines with active recipes found. Make sure machines have recipes set.
machines-found=Found __1__ machines with active recipes.
copy-button=Export
close-button=Close
copy-popup-title=Export your build for the Clock Generator
copy-instructions=The text below is already selected. Press Ctrl+C to copy it, then open clock-generator-self.vercel.app and click "Paste from Factorio" there.
copy-select-button=Select all
copy-select-tooltip=Selects all of the text again, in case you clicked away. Then press Ctrl+C.
col-machine=Machine
col-recipe=Recipe
col-speed=Speed
col-productivity=Productivity
left-out-inserters=__1__ __plural_for_parameter__1__{1=inserter is|rest=inserters are}__ left out of the export, as the clock generator needs what each one takes from and drops into:
left-out-inserter=[entity=__1__] at __2__ __3__
left-out-takes-from=takes from __1__
left-out-drops-into=drops into __1__
left-out-nothing=nothing the sidecar reads (the ground, or an entity it has no type for)
left-out-machine=__1__, which is not in the export: it is a lab, has no recipe or is outside the selection
left-out-a-machine=a machine
left-out-belt=a belt that is not in the export: it is empty or outside the selection
left-out-chest=a chest that is not in the export: it is empty or outside the selection
left-out-belt-drop=a belt that is not in the export: it is empty or outside the selection. Select the build again, with that belt, once items are on it
left-out-chest-drop=a chest that is not in the export: it is empty or outside the selection. Select the build again, with that chest, once items are in it
left-out-drills=__1__ __plural_for_parameter__1__{1=mining drill is|rest=mining drills are}__ left out of the export, as the clock generator needs what each one drops into:
left-out-drill=[entity=__1__] at __2__ __3__
left-out-drill-into=drops into __1__, which is not in the export: it is outside the selection or has no type the sidecar reads
left-out-drill-ground=drops onto the ground, or into more than one machine or chest at its drop position: let it run and select it again
left-out-drill-no-resource=has not mined yet, and the resources under it are none it can mine or more than one kind: let it run and select it again
left-out-tooltip=Left out of the export: the window with the export says why
pickup-warning=Inserter __1__: __2__. The inserter is in the export, marked unsupported: the Clock Generator will not make a clock for it until it picks up from a supported belt.
pickup-bend=picks up from a belt bend
pickup-splitter=picks up from a splitter. Splitters are out of scope for the Clock Generator
pickup-side-loaded=picks up from a belt tile that another belt side-loads onto. Side-loaded pickups are out of scope for the Clock Generator
pickup-inline=picks up in line with the belt, rather than beside it
pickup-unsupported=has unsupported belt pickup geometry
