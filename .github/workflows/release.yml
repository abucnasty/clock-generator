name: Release

# A release of the clock generator and its UI, the deployment of the site and the publishing of the sidecar mod.
#
# Only two merges release and deploy:
# - a release pull request: into master, from a branch release/<slug>, titled `release: ...`;
# - a hotfix pull request: into a branch hotfix/<version> (made from the latest tag), from any branch of this
#   repository, titled `hotfix: ...`.
# Every other push releases nothing. A push to master is still deployed as a preview, with an address of its own in the
# run's summary, to try what is on master before it is released.
#
# The workflow runs on every push to master and to hotfix/**. First the `lookup` job asks whether a pull request of this
# repository already passed test.yml on the very tree that was pushed (.github/scripts/tested-tree.sh; the `changes` job
# of test.yml records the tree of each pull request as an artifact, and the artifact lasts 14 days). If so, the `tests` job
# is skipped and the run goes on with the gate. Else the tests run, as before. After the tests, the gate (.github/scripts/release-gate.sh)
# looks up the pull request behind the pushed commit, and the rest of the `release` job runs only for a release or a
# hotfix merge. Opening a pull request, naming a branch or editing a title releases nothing: only a merge makes the push.
# On a release or a hotfix merge:
# - A generator version with no tag gets a tag at the pushed commit and a GitHub release from CHANGELOG.md. The site
#   users use is deployed from that tag, after the release exists.
# - A sidecar version that the mod portal does not have is published by publish-sidecar.yml, which this workflow calls.
# - A merge where neither version is new fails: a release that releases nothing is a mistake.
#
# The site is the Cloudflare Worker clock-generator (clock-generator-ui/wrangler.jsonc), at https://clock.abucnasty.dev.
# Only this workflow deploys it: production with `wrangler deploy`, the preview of master with
# `wrangler versions upload --preview-alias master`, which production does not change. (vercel.json now only redirects
# the old address, clock-generator-self.vercel.app; this workflow no longer deploys to Vercel.)
# "Run workflow" (or `gh workflow run release.yml`) is for recovery: it deploys the latest released tag to production
# again, for a run that failed part way. It never makes a tag or a release.
# Nothing is released or deployed unless the tests pass: the unit and generation tests, the UI build and the UI's
# Generate in a browser of test.yml. Those tests passed either in this run or, for the same tree, in a pull request. A run by
# hand looks nothing up: its tests always run.
#
# The deployments need two secrets: CLOUDFLARE_API_TOKEN (a Cloudflare API token that can edit Workers scripts and the
# routes and DNS of the abucnasty.dev zone) and CLOUDFLARE_ACCOUNT_ID. See docs/maintainer/workflow-variables-and-secrets.md.
on:
  push:
    branches:
      - master
      - hotfix/**
  workflow_dispatch:

# one at a time, so two merges close together cannot release or deploy out of order
concurrency:
  group: release
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # the wrangler CLI that deploys the site, pinned
  WRANGLER_VERSION: 4.161.0

jobs:
  lookup:
    # Did a pull request of this repository already pass test.yml on this tree? Seconds, not minutes. When it cannot tell,
    # for example when GitHub cannot be read, `tested` stays empty and the tests run: a failed lookup costs time only.
    name: Tested tree
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - uses: actions/checkout@v4

      # a run by hand has no pushed tree behind it: it keeps its tests
      - name: Was this tree tested in a pull request?
        id: tested
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: .github/scripts/tested-tree.sh "$REPO" "$GITHUB_SHA"

  tests:
    name: Tests
    needs: lookup
    # run unless the tree is tested; also when the lookup job itself failed or was skipped, which leaves `tested` empty
    if: ${{ !cancelled() && needs.lookup.outputs.tested != 'true' }}
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
    with:
      generation: true

  release:
    # the tests passed in this run, or were skipped because a pull request passed them on this tree; not when they
    # failed or were cancelled (a skipped `tests` would skip this job without the explicit condition)
    needs: [lookup, tests]
    if: ${{ !cancelled() && (needs.tests.result == 'success' || (needs.tests.result == 'skipped' && needs.lookup.outputs.tested == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.release.outputs.released }}
      sidecar: ${{ steps.new.outputs.sidecar }}
    steps:
      - uses: actions/checkout@v4

      # a run by hand has no merge behind it: it releases nothing
      - name: Gate, is this a release or a hotfix merge?
        id: gate
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: .github/scripts/release-gate.sh "$REPO" "$GITHUB_SHA" "$BRANCH"

      - name: Check versions are in sync
        id: version
        if: steps.gate.outputs.release == 'true'
        run: |
          GENERATOR=$(node -p "require('./clock-generator/package.json').version")
          UI=$(node -p "require('./clock-generator-ui/package.json').version")
          if [ "$GENERATOR" != "$UI" ]; then
            echo "::error::versions differ: clock-generator $GENERATOR, clock-generator-ui $UI"
            exit 1
          fi
          echo "version=$GENERATOR" >> "$GITHUB_OUTPUT"

      - name: Find what is new
        id: new
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SIDECAR=$(node -p "require('./clock-generator-sidecar/info.json').version")
          GENERATOR_NEW=true
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            GENERATOR_NEW=false
          fi
          SIDECAR_NEW=true
          if [ "$(.github/scripts/portal-has-version.sh clock-generator-sidecar "$SIDECAR")" = true ]; then
            SIDECAR_NEW=false
          fi
          if [ "$GENERATOR_NEW" = false ] && [ "$SIDECAR_NEW" = false ]; then
            echo "::error::Nothing to release: clock-generator $VERSION is already released as v$VERSION, and clock-generator-sidecar $SIDECAR is already on the mod portal. Bump a version in the pull request."
            exit 1
          fi
          echo "generator=$GENERATOR_NEW" >> "$GITHUB_OUTPUT"
          echo "sidecar=$SIDECAR_NEW" >> "$GITHUB_OUTPUT"
          echo "New: clock-generator $VERSION $GENERATOR_NEW, clock-generator-sidecar $SIDECAR $SIDECAR_NEW"

      - name: Create GitHub Release
        id: release
        if: steps.new.outputs.generator == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES=$(awk -v version="$VERSION" 'index($0, "## [" version "]") == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          gh release create "v$VERSION" --title "v$VERSION" --notes "$NOTES" --target "$GITHUB_SHA"
          echo "released=true" >> "$GITHUB_OUTPUT"

  production:
    # The site users use: the tag of a release or a hotfix, after its release exists; or, on a run by hand, the latest
    # released tag again
    name: Deploy to production
    needs: release
    if: needs.release.outputs.released == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check the Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID have to be set as secrets to deploy to production. Set them, then run this workflow by hand."
            exit 1
          fi

      - name: Find the tag to deploy
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASED_VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          else
            TAG="v$RELEASED_VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # the commit of the tag, which is not the commit of the push when this is run by hand
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build and deploy
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        working-directory: clock-generator-ui
        run: |
          # a tag from before the move to Cloudflare has no Worker to deploy: it went to Vercel
          if [ ! -f wrangler.jsonc ]; then
            echo "::error::$TAG has no clock-generator-ui/wrangler.jsonc: it was released before the site moved to Cloudflare, and this workflow deploys only to Cloudflare. Release a version that has it."
            exit 1
          fi
          npm ci
          npm run build
          npm install --global "wrangler@$WRANGLER_VERSION"
          wrangler deploy
          echo "Deployed $TAG to production: https://clock.abucnasty.dev" >> "$GITHUB_STEP_SUMMARY"

  sidecar:
    # The sidecar mod, only when its version is new on the mod portal
    name: Publish the sidecar
    needs: release
    if: needs.release.outputs.sidecar == 'true'
    uses: ./.github/workflows/publish-sidecar.yml
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit

  preview:
    # What is on master, released or not, at an address of its own
    name: Deploy master as a preview
    needs: [lookup, tests]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' && (needs.tests.result == 'success' || (needs.tests.result == 'skipped' && needs.lookup.outputs.tested == 'true')) }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check the Cloudflare secrets
        id: cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::No preview of master: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set as secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cloudflare.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.cloudflare.outputs.ready == 'true'
        with:
          node-version: 24

      # A version of the Worker that is not deployed: production keeps serving its own. Its address is the alias
      # master-clock-generator.<account subdomain>.workers.dev, which each push to master moves to its own version.
      - name: Build and upload
        if: steps.cloudflare.outputs.ready == 'true'
        working-directory: clock-generator-ui
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          set -o pipefail
          npm ci
          npm run build
          npm install --global "wrangler@$WRANGLER_VERSION"
          # a version needs a Worker: before its first deployment (docs/maintainer/redeploy-the-site-by-hand.md) there is none
          if ! wrangler versions upload --preview-alias master --message "master at ${GITHUB_SHA::7}" 2>&1 | tee "$RUNNER_TEMP/upload.log"; then
            if grep -q "does not yet exist" "$RUNNER_TEMP/upload.log"; then
              echo "::warning::No preview of master: the Worker clock-generator has never been deployed. Deploy it once (docs/maintainer/redeploy-the-site-by-hand.md)."
              exit 0
            fi
            exit 1
          fi
          URL=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // .preview_url // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
          echo "Preview of master at ${GITHUB_SHA::7}: ${URL:-no address (are Version URLs on for the Worker?)}" >> "$GITHUB_STEP_SUMMARY"
