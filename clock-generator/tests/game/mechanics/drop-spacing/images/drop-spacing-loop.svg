<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-labelledby="title desc">
  <title id="title">The 14 slots of one belt lane in one period</title>
  <desc id="desc">Seven copies of the grenade build stand 12 tiles apart and each has two output inserters 3 tiles apart. In a 112-tick period a turbo belt moves 14 tiles, so one lane is a loop of 14 one-tile slots. The first inserters of the seven copies land on slots 0, 2, 4, 6, 8, 10, 12 and the second inserters on slots 1, 3, 5, 7, 9, 11, 13; every slot is filled once.</desc>
  <style>
    /* Transparent canvas; light colors below remain the fallback for static renderers. */
    @media (prefers-color-scheme: dark) {
      [fill="#1565c0"] { fill: #79b8ff; }
      [fill="#00796b"] { fill: #56d4b0; }
      [fill="#bd4c0b"] { fill: #ffab70; }
      [fill="#203047"] { fill: #e6edf3; }
      [fill="#526176"] { fill: #b3c0d0; }
      [fill="#eaf3ff"] { fill: #182c44; }
      [fill="#e3f4ef"] { fill: #17352f; }
      [fill="#fff2e7"] { fill: #36271d; }
      [stroke="#1565c0"] { stroke: #79b8ff; }
      [stroke="#00796b"] { stroke: #56d4b0; }
      [stroke="#bd4c0b"] { stroke: #ffab70; }
      [stroke="#ccd5df"] { stroke: #40516a; }
      [stroke="#8292a7"] { stroke: #91a4b8; }
    }
  </style>
  <defs>
    <marker id="flow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6" fill="#1565c0" />
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="20" y="30" font-size="22" fill="#203047" font-weight="bold">One lane of the belt in one period: 14 slots, every one filled once</text>
    <text x="20" y="55" font-size="15" fill="#203047" font-weight="normal">Grenade build: 7 copies 12 tiles apart, two inserters a copy (3 tiles apart), a turbo belt, a period of 112 ticks, a hand of 16 at stack size 4 = one tile</text>
    <text x="20" y="78" font-size="13" fill="#203047" font-weight="normal">The belt moves 0.125 tiles a tick, so L = 0.125 × 112 = 14 tiles. Slot = (place − 0.125 × tick) mod 14, counted from copy 0's first inserter. The pattern repeats every period.</text>
    <rect x="20" y="125" width="74" height="70" rx="4" fill="#eaf3ff" stroke="#1565c0" />
    <text x="57" y="119" font-size="12" fill="#526176" font-weight="normal" text-anchor="middle">0</text>
    <text x="57" y="155" font-size="14" fill="#1565c0" font-weight="bold" text-anchor="middle">copy 0</text>
    <text x="57" y="175" font-size="12" fill="#1565c0" font-weight="normal" text-anchor="middle">inserter 1</text>
    <rect x="98" y="125" width="74" height="70" rx="4" fill="#e3f4ef" stroke="#00796b" />
    <text x="135" y="119" font-size="12" fill="#526176" font-weight="normal" text-anchor="middle">1</text>
    <text x="135" y="155" font-size="14" fill="#00796b" font-weight="bold" text-anchor="middle">copy 2</text>
    <text x="135" y="175" font-size="12" fill="#00796b" font-weight="normal" text-anchor="middle">inserter 2</text>
    <rect x="176" y="125" width="74" height="70" rx="4" fill="#eaf3ff" stroke="#1565c0" />
    <text x="213" y="119" font-size="12" fill="#526176" font-weight="normal" text-anchor="middle">2</text>
    <text x="213" y="155" font-size="14" fill="#1565c0" font-weight="bold" text-anchor="middle">copy 1</text>
    <text x="213" y="175" font-size="12" fill="#1565c0" font-weight="normal" text-anchor="middle">inserter 1</text>
    <rect x="254" y="125" width="74" height="70" rx="4" fill="#e3f4ef" stroke="#00796b" />
    <text x="291" y="119" font-size="12" fill="#526176" font-weight="normal" text-anchor="middle">3</text>
    <text x="291" y="155" font-size="14" fill="#00796b" font-weight="bold" text-anchor="middle">copy 3</text>
    <text x="291" y="175" font-size="12" fill="#00796b" font-weight="normal" text-anchor="middle">inserter 2</text>
    <rect x="332" y="125" width="74" height="70" rx="4" fill="#eaf3ff" stroke="#1565c0" />
    <text x="369" y="119" font-size="12" fill="#526176" font-weight="normal" text-anchor="middle">4</text>
    <text x="369" y="155" font-size="14" fill="#1565c0" font-weight="bold" text-anchor="middle">copy 2</text>
    <text x="369" y="175" font-size="12" fill="#1565c0" font-weight="normal" text-anchor="middle">inserter 1</text>
    <rect x="410" y="125" width="74" height="70" rx="4" fill="#e3f4ef" stroke="#00796b" />
    <text x="447" y="119" font-size="12" fill="#526176" font-weight="normal" text-anchor="middle">5</text>
    <text x="447" y="155" font-size="14" fill="#00796b" font-weight="bold" text-anchor="middle">copy 4</text>
    <text x="447" y="175" font-size="12" fill="#00796b" font-weight="normal" text-anchor="middle">inserter 2</text>
    <rect x="488" y="125" width="74" height="70" rx="4" fill="#eaf3ff" stroke="#1565c0" />
    <text x="525" y="119" font-size="12" fill="#526176" font-weight="normal" text-anchor="middle">6</text>
    <text x="525" y="155" font-size="14" fill="#1565c0" font-weight="bold" text-anchor="middle">copy 3</text>
    <text x="525" y="175" font-size="12" fill="#1565c0" font-weight="normal" text-anchor="middle">inserter 1</text>
    <rect x="566" y="125" width="74" height="70" rx="4" fill="#e3f4ef" stroke="#00796b" />
    <text x="603" y="119" font-size="12" fill="#526176" font-weight="normal" text-anchor="middle">7</text>
    <text x="603" y="155" font-size="14" fill="#00796b" font-weight="bold" text-anchor="middle">copy 5</text>
    <text x="603" y="175" font-size="12" fill="#00796b" font-weight="normal" text-anchor="middle">inserter 2</text>
    <rect x="644" y="125" width="74" height="70" rx="4" fill="#eaf3ff" stroke="#1565c0" />
    <text x="681" y="119" font-size="12" fill="#526176" font-weight="normal" text-anchor="middle">8</text>
    <text x="681" y="155" font-size="14" fill="#1565c0" font-weight="bold" text-anchor="middle">copy 4</text>
    <text x="681" y="175" font-size="12" fill="#1565c0" font-weight="normal" text-anchor="middle">inserter 1</text>
    <rect x="722" y="125" width="74" height="70" rx="4" fill="#e3f4ef" stroke="#00796b" />
    <text x="759" y="119" font-size="12" fill="#526176" font-weight="normal" text-anchor="middle">9</text>
    <text x="759" y="155" font-size="14" fill="#00796b" font-weight="bold" text-anchor="middle">copy 6</text>
    <text x="759" y="175" font-size="12" fill="#00796b" font-weight="normal" text-anchor="middle">inserter 2</text>
    <rect x="800" y="125" width="74" height="70" rx="4" fill="#eaf3ff" stroke="#1565c0" />
    <text x="837" y="119" font-size="12" fill="#526176" font-weight="normal" text-anchor="middle">10</text>
    <text x="837" y="155" font-size="14" fill="#1565c0" font-weight="bold" text-anchor="middle">copy 5</text>
    <text x="837" y="175" font-size="12" fill="#1565c0" font-weight="normal" text-anchor="middle">inserter 1</text>
    <rect x="878" y="125" width="74" height="70" rx="4" fill="#e3f4ef" stroke="#00796b" />
    <text x="915" y="119" font-size="12" fill="#526176" font-weight="normal" text-anchor="middle">11</text>
    <text x="915" y="155" font-size="14" fill="#00796b" font-weight="bold" text-anchor="middle">copy 0</text>
    <text x="915" y="175" font-size="12" fill="#00796b" font-weight="normal" text-anchor="middle">inserter 2</text>
    <rect x="956" y="125" width="74" height="70" rx="4" fill="#eaf3ff" stroke="#1565c0" />
    <text x="993" y="119" font-size="12" fill="#526176" font-weight="normal" text-anchor="middle">12</text>
    <text x="993" y="155" font-size="14" fill="#1565c0" font-weight="bold" text-anchor="middle">copy 6</text>
    <text x="993" y="175" font-size="12" fill="#1565c0" font-weight="normal" text-anchor="middle">inserter 1</text>
    <rect x="1034" y="125" width="74" height="70" rx="4" fill="#e3f4ef" stroke="#00796b" />
    <text x="1071" y="119" font-size="12" fill="#526176" font-weight="normal" text-anchor="middle">13</text>
    <text x="1071" y="155" font-size="14" fill="#00796b" font-weight="bold" text-anchor="middle">copy 1</text>
    <text x="1071" y="175" font-size="12" fill="#00796b" font-weight="normal" text-anchor="middle">inserter 2</text>
    <path d="M20 225 H1092" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#flow)" />
    <text x="20" y="247" font-size="13" fill="#526176" font-weight="normal">the belt carries the pattern along; after slot 13 comes slot 0 again, in the next period</text>
    <text x="20" y="285" font-size="14" fill="#203047" font-weight="normal">First inserters (blue) land on slots 0, 2, 4, 6, 8, 10, 12: the copies' places 12 tiles apart are 0, 12, 24, ... mod 14 = even slots.</text>
    <text x="20" y="308" font-size="14" fill="#203047" font-weight="normal">Second inserters (teal) land on slots 1, 3, 5, 7, 9, 11, 13: 3 tiles from the first, so an odd slot.</text>
    <text x="20" y="331" font-size="14" fill="#203047" font-weight="normal">All 14 slots are used once, so every hand has a stretch of belt of its own and none waits.</text>
  </g>
</svg>
